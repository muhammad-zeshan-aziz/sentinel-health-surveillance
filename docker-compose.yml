version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: sentinel_postgis
    restart: always
    environment:
      POSTGRES_DB: sentinel_db
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sentinel_backend
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg2://sentinel:sentinel_pass@db:5432/sentinel_db
      SECRET_KEY: sentinel_secret_dev_key_2026_super_secure_idsr_production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      SALT_PEPPER: KP_HEALTH_IDS_SECRET_PEPPER_2026_PROD_READY
      ENVIRONMENT: production
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sentinel_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
